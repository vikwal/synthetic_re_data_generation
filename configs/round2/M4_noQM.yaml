# Leave-one-out ablation: M4 (deployed) without QM correction.
# Internal experiment_id 'M5all_PL_noQM' kept; round2/paper_style.py:PAPER_RUNG
# translates it to 'M4-noQM' in figures/tables.
round2:
  experiment_id: "M5all_PL_noQM"
  correction: "off"
  shear: "power_law"
  aging_model: "weibull"
  aging: {lambda: 54.5, kappa: 2.0}
  apply_ageing_override: true
  wake: {enabled: true, model: "noj", k: 0.075}
  density: "v1_mixed"
  era5_dir_v2: "/mnt/nvme2/synthetic/raw/wind_era5_v2"
  commissioning_table: "data/round2/park_commissioning.csv"
