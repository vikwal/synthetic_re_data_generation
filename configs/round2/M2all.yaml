# M2all — QM-Korrektur + Power-Law + Fleet-Weibull-Aging (alle 13 Parks), ohne Wakes (Ask 19, Tiefen-Aging-Tabelle)
round2:
  experiment_id: 'M2all'
  correction: 'height_consistent'
  correction_branch: 'auto'
  shear: 'power_law'
  aging_model: 'weibull'
  aging: {lambda: 54.5, kappa: 2.0}
  apply_ageing_override: true
  wake: {enabled: false}
  density: 'v1_mixed'
  era5_dir_v2: '/mnt/nvme2/synthetic/raw/wind_era5_v2'
  commissioning_table: 'data/round2/park_commissioning.csv'
