# Paper M3: M2 + fleet-wide Weibull aging (WP4), no wakes.
# Internal experiment_id 'M2all' kept (join key for results/scores.csv,
# round2/paper_style.py:PAPER_RUNG translates it to 'M3' in figures/tables).
round2:
  experiment_id: 'M2all'
  correction: 'height_consistent'
  correction_branch: 'auto'
  shear: 'power_law'
  aging_model: 'weibull'
  aging: {lambda: 54.5, kappa: 2.0}
  apply_ageing_override: true
  wake: {enabled: false}
  density: 'v1_mixed'
  era5_dir_v2: '/mnt/nvme2/synthetic/raw/wind_era5_v2'
  commissioning_table: 'data/round2/park_commissioning.csv'
