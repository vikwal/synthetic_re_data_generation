# Leave-one-out ablation: M4 (deployed) without aging.
# Internal experiment_id 'M5all_PL_noage' kept; round2/paper_style.py:PAPER_RUNG
# translates it to 'M4-noage' in figures/tables.
round2:
  experiment_id: "M5all_PL_noage"
  correction: "height_consistent"
  correction_branch: "auto"
  shear: "power_law"
  aging_model: "none"
  wake: {enabled: true, model: "noj", k: 0.075}
  density: "v1_mixed"
  era5_dir_v2: "/mnt/nvme2/synthetic/raw/wind_era5_v2"
  commissioning_table: "data/round2/park_commissioning.csv"
